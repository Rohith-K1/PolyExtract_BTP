[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyextract"
version = "0.1.0"
description = "Evidence-linked extraction of molecular-weight characteristics and properties of amorphous polymers from published literature."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rohith K" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "pyarrow>=16",
]

[project.optional-dependencies]
web = ["ddgs>=9"]
pdf = ["pymupdf>=1.24"]
llm = ["anthropic>=2.0"]
ml = ["scikit-learn>=1.5"]
app = ["streamlit>=1.57"]
dev = ["pytest>=8"]
all = ["ddgs>=9", "pymupdf>=1.24", "anthropic>=2.0", "scikit-learn>=1.5", "streamlit>=1.57", "pytest>=8"]

[project.scripts]
polyextract = "polyextract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "live: hits real external APIs (deselect with -m 'not live')",
]
